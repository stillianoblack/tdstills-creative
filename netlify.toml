[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Product portfolio paths now live on tarusstills.com.
# These are individual paths, not a domain-wide redirect.

[[redirects]]
  from = "/product"
  to = "https://tarusstills.com/product"
  status = 301
  force = true

[[redirects]]
  from = "/products"
  to = "https://tarusstills.com/product"
  status = 301
  force = true

